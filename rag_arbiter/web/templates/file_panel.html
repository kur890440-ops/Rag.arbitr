<button class="file-row all-documents" data-select-document=""><span>★</span><span class="file-name">Все документы</span><span class="file-metrics">{{files|sum(attribute='pages')}}с,F{{files|selectattr('fixed','ne',none)|sum(attribute='fixed')}}/E{{files|selectattr('fixed','ne',none)|sum(attribute='fixed')}},S{{files|selectattr('structure','ne',none)|sum(attribute='structure')}}/E{{files|selectattr('structure','ne',none)|sum(attribute='structure')}}</span></button>
{% for processed,label in [(true,'ОБРАБОТАННЫЕ'),(false,'НЕ ОБРАБОТАННЫЕ')] %}
{% set group=files|selectattr('processed','equalto',processed)|list %}
<details class="file-group" data-group="{{'processed' if processed else 'unprocessed'}}" open><summary>{{label}} · {{group|length}}</summary>
{% for file in group %}<div class="file-row" data-file-id="{{file.document_id}}" data-file-name="{{file.name|lower}}">
<button class="file-select" data-select-document="{{file.document_id}}" title="{{file.name}}"><span class="status-dot {{file.status|lower}}" title="{{file.status}}"></span><span class="file-name">{{file.name}}</span><span class="file-metrics">{{file.pages}}с{% if file.processed %},Q{{file.q}}{% if file.o %}/O{{file.o}}{% endif %},F{{file.fixed if file.fixed is not none else '—'}}/E{{file.fixed if file.fixed is not none else '—'}},S{{file.structure if file.structure is not none else '—'}}/E{{file.structure if file.structure is not none else '—'}}{% else %},не обработан{% endif %}{% if file.errors %},!{{file.errors}}{% endif %}</span></button>
<details class="file-menu"><summary aria-label="Действия с {{file.name}}">⋮</summary><div>
<button data-select-document="{{file.document_id}}" data-open-tab="overview">Открыть</button><button data-select-document="{{file.document_id}}" data-open-tab="recognition">Recognition details</button><button data-select-document="{{file.document_id}}" data-open-tab="chunking">Настройки chunking</button><button data-select-document="{{file.document_id}}" data-open-tab="chunking">Пересчитать chunks</button>
{% if file.processed %}<button data-retry-mode="force" data-run="{{run_id}}" data-document="{{file.document_id}}">Повторить Qwen</button>{% endif %}</div></details>
</div>{% endfor %}</details>{% endfor %}
