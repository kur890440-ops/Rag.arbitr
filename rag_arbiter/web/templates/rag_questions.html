<div class="section-head"><h3>КОНТРОЛЬНЫЕ ВОПРОСЫ · {{questions|length}}/10</h3><button type="button" class="secondary" id="rag-run-all" {% if not questions %}disabled{% endif %}>Запустить все</button></div>
<ol class="control-questions">{% for q in questions %}<li><button class="question-text" data-rag-question="{{q.question_id}}" title="{{q.question}}">{{loop.index}}. {{q.question}}</button><button class="text-button" data-rag-edit="{{q.question_id}}" title="Редактировать ожидание">✎</button><button class="text-button" data-rag-delete="{{q.question_id}}" aria-label="Удалить вопрос">×</button></li>{% else %}<li class="muted">Контрольные вопросы ещё не добавлены.</li>{% endfor %}</ol>
