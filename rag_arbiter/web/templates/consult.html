<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Консультант по страхованию</title><link rel="stylesheet" href="/static/consult.css"><script defer src="/static/htmx.min.js"></script><script defer src="/static/consult.js"></script></head>
<body><main class="consult"><header><h1>Консультант по страхованию</h1><p>На вопросы отвечает AI через MiniMax. Сообщения передаются внешнему LLM-провайдеру. Не указывайте персональные данные без необходимости. История временная.</p><button type="button" id="consult-logout">Выйти</button></header>
<section id="messages" aria-label="Диалог" aria-live="polite">{% for message in messages %}{% include 'consult_message.html' %}{% endfor %}</section>
<form id="consult-form" hx-post="/consult/messages" hx-target="#messages" hx-swap="beforeend" data-timeout="{{ timeout_ms }}"><label for="question">Ваш вопрос</label><textarea id="question" name="question" maxlength="{{ max_input }}" required placeholder="Что вы хотите узнать о страховании?"></textarea><div class="actions"><span id="status" role="status"></span><button type="submit">Отправить</button></div><p id="error" role="alert" hidden></p></form></main></body></html>
