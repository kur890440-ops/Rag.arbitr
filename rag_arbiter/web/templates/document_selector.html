<p>Показаны {{pager.start}}–{{pager.end}} из {{pager.total}}</p>
{% for f in pager.files %}<label class="document-option"><input type="checkbox" data-document-id="{{f.document_id or ''}}" {% if f.availability!='INDEXED' %}disabled{% endif %}><span><strong>{{f.filename}}</strong><small>{{f.source_name}} · {{f.format}}{% if f.units %} · страниц/блоков: {{f.units}}{% endif %} · {{'Готов к анализу' if f.availability=='INDEXED' else 'Недоступен для анализа: ' + f.availability}}</small></span></label>{% else %}<p>Документы не найдены.</p>{% endfor %}
<div class="selector-actions"><button type="button" data-selector-offset="{{[0,pager.offset-pager.size]|max}}" {% if pager.page==1 %}disabled{% endif %}>Назад</button><span>Страница {{pager.page}} из {{pager.pages}}</span><button type="button" data-selector-offset="{{pager.offset+pager.size}}" {% if pager.page==pager.pages %}disabled{% endif %}>Далее</button></div>
