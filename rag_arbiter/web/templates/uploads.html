<input type="hidden" name="upload_ids" value="{{ids}}"><ul class="file-list">{% for file in uploads %}<li><strong>{{file.filename}}</strong><span>{{file.pages}} стр. · {{(file.size/1024)|round(1)}} KB · сохранён</span><button type="button" class="text-button" data-remove-upload="{{file.upload_id}}" aria-label="Убрать {{file.filename}}">×</button></li>{% endfor %}</ul><p class="muted">Выбранные файлы войдут в corpus следующего запуска. Повторный запуск использует тот же набор.</p>
